name: Release Electron app

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: electron-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version v${version}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run quality:check

  build:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            dist: npm run dist:mac
          - os: ubuntu-latest
            platform: linux
            dist: npm run dist:linux
          - os: windows-latest
            platform: windows
            dist: npm run dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: Verify macOS release artifacts
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          version='${{ needs.prepare.outputs.version }}'
          for arch in x64 arm64; do
            test -s "dist/Kucedr-${version}-${arch}.dmg"
            test -s "dist/Kucedr-installer-${version}-${arch}.pkg"
            test -s "dist/Kucedr-${version}-${arch}.zip"
          done
      - name: Verify Windows release artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = '${{ needs.prepare.outputs.version }}'
          $installer = "dist/Kucedr-$version.exe"
          $portable = "dist/Kucedr-Portable-$version-x64.exe"
          foreach ($artifact in @($installer, $portable)) {
            if (!(Test-Path $artifact -PathType Leaf) -or (Get-Item $artifact).Length -eq 0) {
              throw "Missing or empty Windows release artifact: $artifact"
            }
          }
      - name: Verify Linux release artifacts
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          version='${{ needs.prepare.outputs.version }}'
          test -s "dist/Kucedr-${version}.AppImage"
          test -s "dist/Kucedr-${version}.tar.gz"
          test -s "dist/Kucedr-${version}.deb"
          test -s "dist/Kucedr-${version}.rpm"
      - uses: actions/upload-artifact@v7
        with:
          name: kucedr-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          name: Kucedr v${{ needs.prepare.outputs.version }} beta
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
