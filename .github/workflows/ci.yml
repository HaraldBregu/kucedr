name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run quality:check
      - run: npm run build
      - run: xvfb-run -a npm run test:e2e
      - run: npm run build:packages
      - run: npm pack --dry-run --workspace @kucedr/sdk
      - run: npm pack --dry-run --workspace @kucedr/cli
