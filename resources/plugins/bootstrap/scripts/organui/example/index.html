<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>OrganUI examples</title>
		<style>
			:root { color-scheme: light dark; --border: color-mix(in srgb, CanvasText 15%, transparent); }
			body { margin: 0; background: Canvas; color: CanvasText; font: 14px/1.4 system-ui, sans-serif; }
			main { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
			h1 { margin: 0 0 4px; font-size: 22px; }
			h2 { margin: 0 0 8px; font-size: 14px; }
			.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 16px; margin-top: 16px; }
			.card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
			.output { width: 100%; height: 400px; border: 0; border-radius: 6px; box-sizing: border-box; }
			.error { color: #d33; white-space: pre-wrap; }
			pre { margin: 0; padding: 8px; background: color-mix(in srgb, CanvasText 6%, transparent); border-radius: 6px; overflow: auto; font-size: 12px; }
			textarea { font: 12px ui-monospace, monospace; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: Canvas; color: inherit; resize: vertical; }
			button { align-self: start; font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: CanvasText; color: Canvas; cursor: pointer; }
			.group { margin: 32px 0 0; font-size: 18px; text-transform: capitalize; }
			summary { cursor: pointer; opacity: 0.7; }
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./main.jsx"></script>
	</body>
</html>
