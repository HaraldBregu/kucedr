<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!--
      Added to the home screen, the game opens without the browser's bars: the only way to get
      the whole screen on iPhone, where Safari has no fullscreen API for web pages.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pac-Man</title>
    <script defer src="./game.js"></script>
    <link rel="stylesheet" href="./game.css">
    <script src="../../bridge.js"></script>
  </head>
  <body>
    <!-- The cabinet's monitor is vertical: 224 pixels wide, 288 tall. -->
    <canvas id="screen" width="224" height="288">Serve un browser con supporto a Canvas.</canvas>
    <!-- Cabinet control panel: visible only on touch screens (see style.css). -->
    <div id="touch-panel" class="panel">
      <div class="pad pad-stick">
        <!-- The virtual joystick: shown instead of the arrows when tuning.config.ts asks for it. -->
        <div class="stick" data-joystick="four-way" aria-hidden="true">
          <div class="stick-base"><div class="stick-knob"></div></div>
        </div>
        <button type="button" class="key key-arrow key-up" data-key="ArrowUp" aria-label="Su">
          ▲
        </button>
        <button
          type="button"
          class="key key-arrow key-left"
          data-key="ArrowLeft"
          aria-label="Sinistra"
        >
          ◀
        </button>
        <button
          type="button"
          class="key key-arrow key-right"
          data-key="ArrowRight"
          aria-label="Destra"
        >
          ▶
        </button>
        <button type="button" class="key key-arrow key-down" data-key="ArrowDown" aria-label="Giù">
          ▼
        </button>
      </div>
      <div class="pad pad-system">
        <button type="button" class="key key-small" data-key="KeyC">MONETA</button>
        <button type="button" class="key key-small" data-key="KeyM">AUDIO</button>
        <!-- Shown by main.ts only where the browser can go fullscreen. -->
        <button type="button" id="fullscreen" class="key key-small" hidden>SCHERMO INTERO</button>
      </div>
      <div class="pad pad-start">
        <button type="button" class="key key-start" data-key="Enter">START</button>
      </div>
    </div>
  </body>
</html>
