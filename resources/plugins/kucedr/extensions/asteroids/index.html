<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!--
      Added to the home screen, the game opens without the browser's bars: the only way to get
      the whole screen on iPhone, where Safari has no fullscreen API for web pages.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Asteroids" />
    <title>Asteroids</title>
    <script type="module" crossorigin src="./game.js"></script>
    <link rel="stylesheet" crossorigin href="./game.css">
  </head>
  <body>
    <!-- Touching the screen is the START button, as on the attract screen of the cabinet. -->
    <canvas id="screen" width="1024" height="768" data-key="Enter">
      Serve un browser con supporto a Canvas.
    </canvas>
    <!--
      Cabinet control panel, visible only on touch screens (see style.css): rotation for the
      left thumb, fire, thrust and hyperspace for the right one.
    -->
    <div id="touch-panel" class="panel">
      <div class="pad pad-move">
        <!-- The virtual joystick: shown instead of the arrows when tuning.config.ts asks for it. -->
        <div class="stick" data-joystick="left-right" aria-hidden="true">
          <div class="stick-base"><div class="stick-knob"></div></div>
        </div>
        <button
          type="button"
          class="key key-arrow"
          data-key="ArrowLeft"
          aria-label="Ruota a sinistra"
        >
          ⟲
        </button>
        <button
          type="button"
          class="key key-arrow"
          data-key="ArrowRight"
          aria-label="Ruota a destra"
        >
          ⟳
        </button>
      </div>
      <!-- Hyperspace is the escape of the last moment: it stays next to fire and thrust. -->
      <div class="pad pad-fire">
        <button type="button" class="key key-hyper" data-key="ArrowDown" aria-label="Iperspazio">
          IPER
        </button>
        <button type="button" class="key key-fire" data-key="Space">FUOCO</button>
        <button type="button" class="key key-thrust" data-key="ArrowUp">SPINTA</button>
      </div>
      <!-- Shown by main.ts only where the browser can go fullscreen. -->
      <div class="pad pad-view">
        <button type="button" id="fullscreen" class="key key-small" hidden>SCHERMO INTERO</button>
      </div>
      <div class="pad pad-system">
        <button type="button" class="key key-small" data-key="KeyM">AUDIO</button>
      </div>
      <p class="rotate-hint">Gira il telefono: si gioca meglio in orizzontale.</p>
    </div>
  </body>
</html>
